name: 배포
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: fast-jira-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'hellojianijinworld/fast-jira' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: main에 포함된 커밋 확인
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package:release
      - run: npm run smoke:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-jira-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: github.repository == 'hellojianijinworld/fast-jira' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fast-jira-release
          path: release
      - name: 파일 첨부 후 정식 Release 공개
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" --generate-notes --latest
